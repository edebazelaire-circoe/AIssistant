name: Apply Jarvis V0.3 release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-v0.3-ux
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and apply validated V0.3
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/v03payload/chunk000 \
            .github/v03payload/rest000 \
            .github/v03payload/rest001 \
            .github/v03payload/rest002 \
            .github/v03payload/rest003 \
            | tr -d '\r\n' \
            | base64 -d \
            > /tmp/jarvis-v03.tar.gz

          echo 'a3e7b6a40c47a14556aa7851fd871027e0edd4624e7af3448a4141821a4ae26b  /tmp/jarvis-v03.tar.gz' | sha256sum -c -
          tar -tzf /tmp/jarvis-v03.tar.gz
          tar -xzf /tmp/jarvis-v03.tar.gz -C .

          rm -rf .github/v02exact .github/v03payload
          rm -f .github/workflows/apply-jarvis-v02.yml .github/workflows/apply-jarvis-v03.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Implement Jarvis V0.3 interaction and debug UX'
          git push origin HEAD:agent/jarvis-v0.3-ux
