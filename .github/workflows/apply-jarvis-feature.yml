name: Apply Jarvis feature

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jarvis-ux-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply verified application files
        shell: bash
        run: |
          set -euo pipefail
          find .github/jarvis-feature -maxdepth 1 -type f -name 'chunk*' -print0 \
            | sort -zV \
            | xargs -0 cat \
            | base64 -d > /tmp/jarvis-feature.tar.gz
          echo 'a903b5211eddec882571e1946a636b43076874d0cb0e980d1749388282383e55  /tmp/jarvis-feature.tar.gz' | sha256sum -c -
          tar -tzf /tmp/jarvis-feature.tar.gz
          tar -xzf /tmp/jarvis-feature.tar.gz -C .
          rm -rf .github/jarvis-feature
          rm -f .github/workflows/apply-jarvis-feature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Implement Jarvis interaction and debug UX'
          git push origin HEAD:agent/jarvis-ux-final
